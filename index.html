<style>
:root{--card:#fff;--tx:#1e1b4b;--ok:#16a34a;--no:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--card:#1e1b4b;--tx:#eef2ff}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif}
body{background:linear-gradient(135deg,#4f46e5,#06b6d4);background-attachment:fixed;color:var(--tx);padding:14px}
.wrap{max-width:600px;margin:0 auto}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .35s}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
h1{margin:0 0 4px;font-size:25px;text-align:center}
.sub{text-align:center;opacity:.75;margin:0 0 14px;font-size:14px;line-height:1.7}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec{border:0;border-radius:16px;padding:14px 8px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;position:relative;line-height:1.5}
.sec:active{transform:scale(.95)}
.sec b{display:block;font-size:26px}
.sec small{display:block;font-weight:400;opacity:.92;margin-top:3px}
.sec .st{position:absolute;top:6px;left:8px;font-size:12px}
.all{grid-column:1/-1;background:linear-gradient(90deg,#f59e0b,#ef4444)}
.top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}
.bar{height:10px;background:rgba(127,127,127,.25);border-radius:9px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#06b6d4);transition:width .4s}
.lesson{font-size:13px;opacity:.7;margin-bottom:4px}
.q{font-size:20px;line-height:1.9;font-weight:700;margin:4px 0 14px}
.opt{display:block;width:100%;text-align:right;border:2px solid rgba(127,127,127,.35);background:transparent;color:inherit;border-radius:14px;padding:12px 14px;margin-bottom:9px;font-size:18px;cursor:pointer;line-height:1.6}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff;animation:j .4s}
.opt.no{background:var(--no);border-color:var(--no);color:#fff;animation:sk .4s}
@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes j{50%{transform:scale(1.04)}}
.exp{display:none;margin-top:4px;padding:11px;border-radius:12px;background:rgba(245,158,11,.16);line-height:1.8;font-size:16px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(90deg,#4f46e5,#06b6d4);cursor:pointer;margin-top:10px}
.btn.alt{background:linear-gradient(90deg,#64748b,#334155)}.btn.red{background:linear-gradient(90deg,#f97316,#dc2626)}
.big{font-size:58px;text-align:center}.stars{font-size:38px;text-align:center;letter-spacing:6px}
.score{font-size:28px;font-weight:800;text-align:center}
.rev{margin-top:10px;font-size:15px;line-height:1.8}.rev div{padding:8px;border-radius:10px;background:rgba(220,38,38,.1);margin-bottom:6px}
.note{font-size:12px;opacity:.65;text-align:center;margin-top:12px}
